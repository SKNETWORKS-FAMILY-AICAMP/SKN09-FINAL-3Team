<!-- 히스토리 패널 (기본적으로 닫힘) -->
<div class="history-panel collapsed" id="historyPanel">
  <div class="history-toggle" onclick="App.history.togglePanel()">
    <div class="history-icon">📋</div>
  </div>
  <div class="history-content" id="historyContent">
    <div class="history-section">
      <div class="section-header">
        <h4>My History</h4>
      </div>
      <div class="history-items" id="myHistoryItems"></div>
    </div>
    <div class="history-section">
      <div class="section-header">
        <h4>My Team History</h4>
        <button class="refresh-btn"
                onclick="App.history.refreshTeam()"
                title="새로고침">🔄</button>
      </div>
      <div class="history-items" id="teamHistoryItems"></div>
    </div>
    <div class="new-template-section">
      <button class="new-template-btn"
              onclick="App.template.createNew()">
        <span class="btn-icon">📝</span>
        New Template
      </button>
    </div>
  </div>
</div>
